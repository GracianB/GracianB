<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070809">
  <title>404 · Gracián Baena</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#070809;--text:#f4f1eb;--muted:#9e9a92;--line:rgba(244,241,235,.12);--gold:#d8ae64;--cyan:#7af3ff;--serif:Georgia,"Times New Roman",serif;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 50% 20%,rgba(122,243,255,.06),transparent 24rem),var(--bg);color:var(--text);font-family:var(--sans)}
    main{width:min(100%,34rem);padding:1.5rem;border:1px solid var(--line);border-radius:1.3rem;background:rgba(255,255,255,.02)}
    .mark{display:grid;place-items:center;width:2.6rem;height:2.6rem;border:1px solid rgba(216,174,100,.35);border-radius:50%;color:var(--gold);font:700 .68rem var(--mono)}
    .code{margin:2.5rem 0 .55rem;color:var(--cyan);font:700 .58rem var(--mono);letter-spacing:.18em}
    h1{margin:0;font:500 clamp(2.4rem,8vw,4.3rem)/.95 var(--serif);letter-spacing:-.04em}
    p{margin:1rem 0 0;max-width:28rem;color:var(--muted);line-height:1.7}
    nav{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.7rem}
    a{display:inline-flex;align-items:center;min-height:2.8rem;padding:.65rem .9rem;border:1px solid var(--line);border-radius:999px;color:var(--text);font:700 .58rem var(--mono);text-decoration:none}
    a:first-child{border-color:var(--gold);background:var(--gold);color:#111}
    a:hover{border-color:var(--cyan)}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="mark">GB</span>
    <p class="code">404 / ROUTE NOT FOUND</p>
    <h1>Esta ruta no existe.</h1>
    <p>El hub, la evidencia profesional y los documentos siguen en su sitio. A veces perder una URL es más fácil que perder el hilo del sistema.</p>
    <nav aria-label="Volver">
      <a href="./">Volver al hub →</a>
      <a href="./#documents">Documentos</a>
    </nav>
  </main>
</body>
</html>
