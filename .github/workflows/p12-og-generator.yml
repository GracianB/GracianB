name: P12 Constellation OG Image

on:
  push:
    branches: [design/p12-constellation-atlas-20261019]
    paths:
      - .github/workflows/p12-og-generator.yml
      - scripts/render-og-p12.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Render deterministic social card
        run: |
          python -m pip install pillow==11.3.0
          python scripts/render-og-p12.py
          python - <<'PY'
          from PIL import Image
          im = Image.open('og-cover.png')
          assert im.size == (1200, 630)
          assert im.mode in ('P', 'RGB')
          PY
      - name: Commit updated PNG to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "P12: publish original constellation social share card"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
