name: P57 one-time AiGoritmo PDF link correction

on:
  push:
    branches:
      - docs/cv-profesional-gris-plata-20261018-213325
    paths:
      - .github/workflows/_p57_aigoritmo_patch.yml

permissions:
  contents: write

jobs:
  fix-two-cv-links:
    name: Correct AiGoritmo links in 2 CVs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF editor for single-use patch
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Correct only 2 source links and verify exact PDF sources
        run: python tools/p57_aigoritmo_pdf_link.py
      - name: Commit and push only the two professional CV PDFs
        shell: bash
        run: |
          set -euo pipefail
          git add -- Gracian_Baena_CV_2026_ES.pdf Gracian_Baena_CV_2026_EN.pdf
          count="$(git diff --cached --name-only | wc -l)"
          [ "$count" -eq 2 ] || { echo "Expected exactly two changed PDFs, got $count"; exit 1; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(cv): route AiGoritmo source labels to public Systems Lab"
          git push origin HEAD:refs/heads/docs/cv-profesional-gris-plata-20261018-213325
