name: GracianB Final Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gracianb-quality-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check i18n.js
          node --check scripts/static-contract.mjs
          node --check scripts/browser-smoke.mjs
          node --check scripts/performance-audit.mjs
          node --check scripts/live-contract.mjs
          node --check scripts/portfolio-links.mjs
          node --check scripts/ecosystem-health.mjs
          node --check scripts/cabin-documents-check.mjs
          node --check scripts/live-cv-pdfs.mjs
          node --check apply.js
          node --check scripts/applications-b6.mjs
          node --check scripts/sitemap-b6.mjs
      - name: Verify sanitized public Aga preview
        run: node scripts/check-aga-public-preview.mjs
      - name: Verify public Maria V20 without private attachments
        run: |
          node --check maria-romera-vista-previa/mr-v20.js
          node scripts/check-maria-public-v20.mjs
      - name: Professional hub contract
        run: node scripts/static-contract.mjs
      - name: Portfolio destinations static contract
        run: node scripts/portfolio-links.mjs --static
      - name: Ecosystem approved-public-site static contract
        run: node scripts/ecosystem-health.mjs --static
      - name: Public cabin crew documents and PDF recovery
        run: node scripts/cabin-documents-check.mjs
      - name: Application desk twelve-PDF static contract
        run: node scripts/applications-b6.mjs --static
      - name: Application discovery sitemap contract
        run: node scripts/sitemap-b6.mjs

  browser:
    name: Browser E2E
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned browser runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Aga trilingual web-preview E2E without private CVs
        run: node scripts/aga-public-preview-e2e.mjs
      - name: Maria procurement decision lab E2E · desktop and mobile
        run: node scripts/maria-public-v20-e2e.mjs
      - name: Desktop + mobile + reduced motion
        run: node scripts/browser-smoke.mjs
      - name: Recruiter application paths ES/EN and responsive interactions
        run: node scripts/applications-b6.mjs
      - name: P6 browser resource and rendering audit
        run: node scripts/performance-audit.mjs
      - name: Upload final hub evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gracianb-final-e2e-${{ github.sha }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 14
