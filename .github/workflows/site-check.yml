name: Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css main.js i18n.js site.webmanifest favicon.svg og-cover.svg README.md; do
            test -s "$file" || { echo "::error file=$file::Missing or empty required file"; exit 1; }
          done

      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check i18n.js

      - name: Validate HTML contract
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          html = Path("index.html").read_text(encoding="utf-8")

          required = [
              '<html lang="es"',
              '<main id="main"',
              'rel="canonical"',
              'property="og:title"',
              'property="og:image"',
              'name="twitter:card"',
              'application/ld+json',
              'id="drawer"',
              'id="cmd"',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              print("Missing HTML contract items:", missing)
              sys.exit(1)

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              print("Duplicate IDs:", dup)
              sys.exit(1)

          print(f"HTML contract OK · {len(ids)} ids · no duplicates")

      - name: Validate CSS structure
        shell: python
        run: |
          from pathlib import Path
          import sys

          css = Path("styles.css").read_text(encoding="utf-8")
          depth = 0
          for i, ch in enumerate(css, 1):
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth < 0:
                      print("Unexpected closing brace near character", i)
                      sys.exit(1)
          if depth != 0:
              print("Unbalanced CSS braces:", depth)
              sys.exit(1)

          for token in ["prefers-reduced-motion", ".skip", ".noscript-note", ".cmd-panel"]:
              if token not in css:
                  print("Missing CSS hardening token:", token)
                  sys.exit(1)

          print("CSS structure OK")

      - name: Validate i18n coverage
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("i18n.js").read_text(encoding="utf-8")

          html_keys = set(re.findall(r'data-i18n(?:-html|-placeholder)?="([^"]+)"', html))
          es = re.search(r'es:\s*\{(.*?)\n\s*\},\n\s*en:\s*\{', js, re.S)
          en = re.search(r'en:\s*\{(.*?)\n\s*\}\s*};?', js, re.S)

          if not es or not en:
              print("Could not locate ES/EN dictionaries")
              sys.exit(1)

          es_keys = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*:', es.group(1), re.M))
          en_keys = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*:', en.group(1), re.M))

          missing_es = sorted(html_keys - es_keys)
          missing_en = sorted(html_keys - en_keys)
          if missing_es or missing_en:
              print("Missing ES:", missing_es)
              print("Missing EN:", missing_en)
              sys.exit(1)

          print(f"i18n coverage OK · {len(html_keys)} HTML keys")
