<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Gracián Baena — One curiosity. Three worlds.</title>
  <desc id="desc">A cinematic graphite and platinum-blue personal portfolio banner connecting professional systems, yoga practice, and creative technology.</desc>
